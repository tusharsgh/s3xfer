[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s3xfer"
version = "0.1.0"
description = "Stream and copy S3 objects of any size in constant memory"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["boto3[crt]>=1.26"]  # crt: needed for `aws login` credentials

[project.optional-dependencies]
dev = ["pytest", "moto[s3]>=5", "openpyxl"]
bench = ["moto[server]>=5", "matplotlib"]

[project.scripts]
s3xfer = "s3xfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/s3xfer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
