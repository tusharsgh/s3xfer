[build-system]
requires = ["hatchling>=1.27"]  # 1.27: PEP 639 license expressions
build-backend = "hatchling.build"

[project]
name = "s3xfer"
version = "0.1.0"
description = "Stream and copy S3 objects of any size in constant memory"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["boto3[crt]>=1.42"]  # crt: needed for `aws login` credentials

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5.1", "openpyxl>=3.1"]
bench = ["moto[server]>=5.1", "matplotlib>=3.9"]

[project.scripts]
s3xfer = "s3xfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/s3xfer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
