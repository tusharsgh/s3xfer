[build-system]
requires = ["hatchling>=1.27"]  # 1.27+ writes License-Expression + License-File (PEP 639); 1.26 builds but writes the legacy License field
build-backend = "hatchling.build"

[project]
name = "s3xfer"
dynamic = ["version"]
description = "Stream, copy and sync S3 objects of any size in constant memory"
readme = "README.pypi.md"  # PyPI page; README.md (with charts and repo links) is for GitHub
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tushar Singh" }]
keywords = ["s3", "aws", "boto3", "copy", "sync", "multipart", "streaming", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["boto3[crt]>=1.42"]  # oldest tested (includes `aws login` support); crt extra is required for `aws login`

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5.1", "openpyxl>=3.1"]
bench = ["moto[server]>=5.1", "matplotlib>=3.9"]

[project.scripts]
s3xfer = "s3xfer.cli:main"

[tool.hatch.version]
path = "src/s3xfer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/s3xfer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
